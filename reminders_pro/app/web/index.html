<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reminders Pro</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--fg:#1b2333;--mut:#667089;--line:#e3e8f2;--pri:#3b6ef5;--pri2:#2a56d0;--ok:#1f9d55;--warn:#d98a00;--bad:#d64545;--chip:#eef2fb;--shadow:0 1px 3px rgba(20,30,60,.08),0 4px 14px rgba(20,30,60,.05);--r:14px}
@media (prefers-color-scheme:dark){:root{--bg:#10141c;--card:#181e2a;--fg:#e8ecf5;--mut:#9aa4bb;--line:#2a3347;--pri:#6c93ff;--pri2:#8ba9ff;--chip:#222b3d;--shadow:0 1px 3px rgba(0,0,0,.4)}}
*{box-sizing:border-box}html,body{margin:0}body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:14px 14px 90px}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
header h1{font-size:20px;margin:0;flex:1;min-width:140px;display:flex;align-items:center;gap:8px}
.logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#3b6ef5,#7a4df0);display:grid;place-items:center;color:#fff;font-size:16px}
select,input[type=text],input[type=number],input[type=date],input[type=time],input[type=url],textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:38px;max-width:100%}
textarea{width:100%;min-height:70px;font-family:ui-monospace,Consolas,monospace;font-size:13px}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--pri) 55%,transparent);border-color:var(--pri)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;cursor:pointer;min-height:38px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--pri)}.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}.btn.pri:hover{background:var(--pri2)}
.btn.bad{color:var(--bad)}.btn.sm{padding:4px 9px;min-height:30px;font-size:13px}.btn.ghost{background:transparent}
.tabs{display:flex;gap:4px;overflow:auto;border-bottom:1px solid var(--line);margin-bottom:14px}
.tab{padding:9px 14px;cursor:pointer;border:0;background:none;color:var(--mut);border-bottom:3px solid transparent;white-space:nowrap}
.tab.on{color:var(--pri);border-bottom-color:var(--pri);font-weight:600}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1;min-width:0}
.mut{color:var(--mut)}.small{font-size:13px}.tiny{font-size:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:3px 11px;cursor:pointer;font-size:13px;user-select:none;display:inline-flex;gap:5px;align-items:center}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.chip .x{opacity:.7;margin-left:2px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.rem{display:flex;gap:12px;align-items:flex-start;border-left:5px solid var(--cc,var(--pri))}
.rem h3{margin:0;font-size:16px}.rem.off{opacity:.6}
.badge{font-size:11.5px;padding:1px 8px;border-radius:999px;background:var(--chip);color:var(--mut);border:1px solid var(--line)}
.badge.ok{color:var(--ok)}.badge.warn{color:var(--warn)}.badge.bad{color:var(--bad)}
.acts{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.switch{position:relative;width:42px;height:24px;flex:none}.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:#b8c0d4;border-radius:24px;transition:.2s;cursor:pointer}
.switch span:before{content:"";position:absolute;height:18px;width:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked+span{background:var(--ok)}.switch input:checked+span:before{transform:translateX(18px)}
.banner{background:color-mix(in srgb,var(--warn) 14%,var(--card));border:1px solid color-mix(in srgb,var(--warn) 45%,var(--line));border-radius:var(--r);padding:10px 14px;margin-bottom:12px}
.quick{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.quick input[type=text]{flex:1;min-width:180px}
.day{font-weight:600;margin:16px 0 6px;color:var(--mut);text-transform:capitalize}
.ag{display:flex;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}.ag:first-of-type{border-top:0}.ag .tm{width:52px;font-variant-numeric:tabular-nums;font-weight:600}
.overlay{position:fixed;inset:0;background:rgba(10,15,30,.55);z-index:50;display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:16px}
.sheet{background:var(--bg);border-radius:18px;max-width:760px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.sheet-h{display:flex;align-items:center;gap:10px;padding:14px 16px;position:sticky;top:0;background:var(--bg);border-radius:18px 18px 0 0;z-index:2;border-bottom:1px solid var(--line)}
.sheet-h h2{margin:0;font-size:18px;flex:1}.sheet-b{padding:14px 16px}
.sheet-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);border-radius:0 0 18px 18px;flex-wrap:wrap}
.sec{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);margin:18px 0 8px;font-weight:700}
label.f{display:block;margin:10px 0 4px;font-size:13px;color:var(--mut)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:8px 14px;cursor:pointer}.seg button.on{background:var(--pri);color:#fff}
.sub{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
.prev{background:var(--card);border:1px dashed var(--pri);border-radius:12px;padding:10px 12px;margin-top:12px}
.prev ol{margin:6px 0 0;padding-left:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:2px 14px;font-variant-numeric:tabular-nums}
.prev .sum{font-weight:600;color:var(--pri)}
.err{color:var(--bad);font-size:13px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#222c42;color:#fff;padding:10px 18px;border-radius:12px;z-index:99;box-shadow:0 6px 24px rgba(0,0,0,.4);max-width:90vw}
.toast.bad{background:var(--bad)}
.tg{max-height:160px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--card)}
.tg label{display:flex;gap:8px;align-items:center;padding:3px 0;cursor:pointer}
.help h2{font-size:17px;margin:20px 0 6px}.help table{border-collapse:collapse;width:100%;font-size:14px}.help td,.help th{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}.help code{background:var(--chip);padding:1px 6px;border-radius:6px;font-size:13px}
.hist{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-top:1px solid var(--line);font-size:14px}.hist:first-child{border-top:0}.hist .t{color:var(--mut);width:120px;flex:none;font-variant-numeric:tabular-nums;font-size:13px}
@media (max-width:560px){.wrap{padding:10px 10px 90px}.overlay{padding:0}.sheet{border-radius:0;min-height:100vh}.sheet-h,.sheet-f{border-radius:0}.hist .t{width:88px}}

help_note:"", help:`
<h2>Kom igång</h2>
<p>Tryck <b>+ Ny påminnelse</b>, skriv en rubrik, välj <b>När</b> och <b>Hur</b> du vill meddelas och spara. Under ”Nästa tillfällen” ser du direkt vilka tider som gäller.</p>
<h2>Exempel på När</h2>
<table><tr><th>Önskemål</th><th>Inställning</th></tr>
<tr><td>Var 3:e dag 08:00, 12:00 och 18:00</td><td>Återkommande · Var 3 dagar · lägg till tre klockslag</td></tr>
<tr><td>Varannan vecka måndag och torsdag</td><td>Var 2 veckor · markera Mån och Tors</td></tr>
<tr><td>Varannan månad den 15:e</td><td>Var 2 månader · Bestämda datum · 15</td></tr>
<tr><td>Sista fredagen i månaden</td><td>Var 1 månad · Veckodag · sista · fredag</td></tr>
<tr><td>Första måndagen i månaden</td><td>Veckodag · första · måndag</td></tr>
<tr><td>Varje år 3 mars</td><td>Var 1 år · Månader: mars · Bestämda datum: 3</td></tr>
<tr><td>Var 20:e minut mellan 08 och 17</td><td>Var 20 minuter · Bara mellan 08:00 och 17:00 (eller Var 1 dag med en serie)</td></tr>
<tr><td>Bara vardagar</td><td>Var 1 dag · Bara dessa dagar: Mån–Fre</td></tr>
<tr><td>Sista vardagen i månaden</td><td>Veckodag · sista · vardag</td></tr></table>
<p>Start, slut, ”efter N gånger”, undantagsdatum och paus finns under <b>När</b>. Undantagna och överhoppade datum räknas inte mot ”efter N gånger”.</p>
<p><b>Sommar- och vintertid:</b> klockslag följer väggklockan. Ett klockslag som saknas när klockan går fram (t.ex. 02:30) skickas 03:30; ett som finns två gånger när klockan går tillbaka skickas en gång. ”Var N:e minut/timme” räknar verklig förfluten tid.</p>
<h2>Sätt att meddelas</h2>
<ul><li><b>Mobilpush</b> – med knapparna Klart, Snooze och Hoppa över (Companion-appen).</li>
<li><b>Valfri notify-tjänst</b> – t.ex. Telegram, e-post, Alexa, Signal. Extra data som JSON, t.ex. <code>{"parse_mode":"html"}</code>.</li>
<li><b>Persistent notis</b>, <b>röst</b> (TTS till en mediaspelare), <b>ljud</b> (fil i /media eller webbadress).</li>
<li><b>Anropa tjänst</b>, <b>sätt entitet</b> och <b>skicka event</b> för egna automationer.</li></ul>
<h2>Egna texter och variabler</h2>
<p><code>{title}</code> <code>{message}</code> <code>{date}</code> <code>{time}</code> <code>{weekday}</code> <code>{n}</code> (tillfälle nr) <code>{remaining}</code> <code>{next}</code> <code>{category}</code> <code>{attempt}</code>. Värden från Home Assistant: <code>{state:sensor.temp}</code>, <code>{attr:climate.x:current_temperature}</code>, <code>{name:sensor.temp}</code>.</p>
<h2>Upprepa tills kvitterat</h2>
<p>Slå på under Alternativ. Notisen skickas igen var N:e minut (högst M gånger) tills du trycker <b>Klart</b>, <b>Snooze</b> eller <b>Hoppa över</b> – i mobilen, här i panelen eller på dashboardkortet. Utan kvittens avslutas serien och eventet <code>reminders_pro_unacknowledged</code> skickas.</p>
<h2>Tysta timmar och ”hemma”</h2>
<p>Under Inställningar. Under tysta timmar skjuts påminnelsen antingen upp tills de är slut eller hoppas över. ”Bara om någon är hemma” använder de personer du valt.</p>
<h2>Integration</h2>
<ul><li><b>Kalender:</b> <code>calendar.reminders_pro</code> (lägg till integrationen ”Reminders Pro” – se Inställningar).</li>
<li><b>Sensorer:</b> <code>sensor.reminders_pro_next</code>, <code>_today</code>, <code>_active</code>, <code>_unacknowledged</code>, <code>_last</code> och <code>binary_sensor.reminders_pro_attention</code>.</li>
<li><b>Events:</b> <code>reminders_pro_fired</code>, <code>_done</code>, <code>_snoozed</code>, <code>_skipped</code>, <code>_unacknowledged</code>.</li>
<li><b>Kommandon</b> till add-onet: event <code>reminders_pro_command</code> med t.ex. <code>{"cmd":"quick","title":"Pasta klar","minutes":10}</code>, <code>{"cmd":"done","token":"…"}</code>, <code>{"cmd":"trigger","id":3}</code>, <code>{"cmd":"pause","id":3,"days":2}</code>.</li>
<li><b>Dashboardkort:</b> Reminders Pro: nästa, idag, kommande, kvittens, snabb (fungerar även via Nabu Casa).</li></ul>
<h2>Felsökning</h2>
<p>Inget kommer fram? Tryck <b>Testa</b> på påminnelsen och titta i <b>Historik</b>. Mottagarlistan tom betyder att add-onet inte når HA. Notiser och tid följer Home Assistants tidszon.</p><h2>Egna knappar, TV-notis och villkor</h2>
<p><b>Egna knappar:</b> under <i>Alternativ → Knappar i mobilnotisen</i> lägger du till knappar som växlar/slår på/slår av en entitet, startar en automation, kör ett skript, aktiverar en scen, anropar en tjänst, sätter ett värde eller skickar ett event. Välj om påminnelsen ska kvitteras vid tryck. Android visar högst 3 knappar (dina egna först).</p>
<p><b>Android TV / Fire TV:</b> lägg till sättet <i>Android TV-notis</i> och välj notify-tjänsten för ”Notifications for Android TV”. Du kan ange tid, position, textstorlek, färg, ikon och bild.</p>
<p><b>Villkor:</b> under <i>Alternativ → Villkor</i> kan du bara skicka om (eller hoppa över om) entiteter har ett visst värde – t.ex. temperatur under 5, en person hemma eller ett attribut som stämmer. Hoppas en påminnelse över syns det i historiken.</p>
<p><b>Egen sensor:</b> bocka i <i>Skapa en egen sensor</i> under Alternativ så får påminnelsen en sensor (sensor.reminders_pro_namnet) med nästa tillfälle – bra att visa i mobilen.</p>
<h2>Nytt i 1.3</h2>
<p><b>Förvarning:</b> under <i>Alternativ → Förvarning</i> lägger du till t.ex. ”7 dagar före” och ”1 dag före”. Du får då en extra notis före varje tillfälle (utan knappar). Ange <i>Födelseår</i> så kan texten innehålla <code>{age}</code>, t.ex. ”{title} fyller {age} år”.</p>
<p><b>Efter senast utfört:</b> välj <i>Efter senast utfört</i> under När. Nästa tillfälle räknas från den dag du trycker Klart (eller <i>Utfört nu</i> på kortet) – bra för filterbyten och liknande.</p>
<p><b>Från en entitet:</b> välj <i>Från en entitet</i> under När. Påminnelsen utlöses när villkoren uppfylls (valfritt: i minst N minuter) och utlöses igen först när de varit ouppfyllda emellan, med valfri spärrtid.</p>
<p><b>Kategorisensor:</b> bocka i 📅 vid en kategori under Inställningar så får du <code>sensor.reminders_pro_kategori_namn</code> med nästa påminnelse, dagar kvar och datum.</p>

help_note:"", help:`
<h2>Getting started</h2>
<p>Press <b>+ New reminder</b>, type a title, choose <b>When</b> and <b>How</b> you want to be notified, and save. “Next occurrences” shows the exact times right away.</p>
<h2>Examples for When</h2>
<table><tr><th>You want</th><th>Setting</th></tr>
<tr><td>Every 3rd day at 08:00, 12:00 and 18:00</td><td>Repeating · Every 3 days · add three times</td></tr>
<tr><td>Every other week on Monday and Thursday</td><td>Every 2 weeks · tick Mon and Thu</td></tr>
<tr><td>Every other month on the 15th</td><td>Every 2 months · Specific dates · 15</td></tr>
<tr><td>Last Friday of the month</td><td>Every 1 month · Weekday · last · Friday</td></tr>
<tr><td>First Monday of the month</td><td>Weekday · first · Monday</td></tr>
<tr><td>Every year on 3 March</td><td>Every 1 year · Months: March · Specific dates: 3</td></tr>
<tr><td>Every 20 minutes between 08 and 17</td><td>Every 20 minutes · Only between 08:00 and 17:00 (or Every 1 day with a series)</td></tr>
<tr><td>Weekdays only</td><td>Every 1 day · Only these days: Mon–Fri</td></tr>
<tr><td>Last weekday of the month</td><td>Weekday · last · weekday (Mon–Fri)</td></tr></table>
<p>Start, end, “after N times”, exception dates and pause are under <b>When</b>. Exception and skipped dates do not count towards “after N times”.</p>
<p><b>Daylight saving time:</b> times of day follow the wall clock. A time that does not exist when clocks spring forward (e.g. 02:30) fires at 03:30; a time that occurs twice when clocks fall back fires once. “Every N minutes/hours” counts real elapsed time.</p>
<h2>Ways to be notified</h2>
<ul><li><b>Mobile push</b> – with Done, Snooze and Skip buttons (Companion app).</li>
<li><b>Any notify service</b> – e.g. Telegram, e-mail, Alexa, Signal. Extra data as JSON, e.g. <code>{"parse_mode":"html"}</code>.</li>
<li><b>Persistent notification</b>, <b>voice</b> (TTS on a media player), <b>sound</b> (file in /media or a web address).</li>
<li><b>Call a service</b>, <b>set an entity</b> and <b>fire an event</b> for your own automations.</li></ul>
<h2>Custom text and variables</h2>
<p><code>{title}</code> <code>{message}</code> <code>{date}</code> <code>{time}</code> <code>{weekday}</code> <code>{n}</code> (occurrence no.) <code>{remaining}</code> <code>{next}</code> <code>{category}</code> <code>{attempt}</code>. Home Assistant values: <code>{state:sensor.temp}</code>, <code>{attr:climate.x:current_temperature}</code>, <code>{name:sensor.temp}</code>.</p>
<h2>Repeat until acknowledged</h2>
<p>Turn it on under Options. The notification is sent again every N minutes (at most M times) until you press <b>Done</b>, <b>Snooze</b> or <b>Skip</b> – on your phone, in this panel or on the dashboard card. Without acknowledgement the series ends and the event <code>reminders_pro_unacknowledged</code> is fired.</p>
<h2>Quiet hours and “home”</h2>
<p>Under Settings. During quiet hours a reminder is either postponed until they end or skipped. “Only if someone is home” uses the people you picked.</p>
<h2>Integration</h2>
<ul><li><b>Calendar:</b> <code>calendar.reminders_pro</code> (add the “Reminders Pro” integration – see Settings).</li>
<li><b>Sensors:</b> <code>sensor.reminders_pro_next</code>, <code>_today</code>, <code>_active</code>, <code>_unacknowledged</code>, <code>_last</code> and <code>binary_sensor.reminders_pro_attention</code>.</li>
<li><b>Events:</b> <code>reminders_pro_fired</code>, <code>_done</code>, <code>_snoozed</code>, <code>_skipped</code>, <code>_unacknowledged</code>.</li>
<li><b>Commands</b> to the add-on: event <code>reminders_pro_command</code>, e.g. <code>{"cmd":"quick","title":"Pasta ready","minutes":10}</code>, <code>{"cmd":"done","token":"…"}</code>, <code>{"cmd":"trigger","id":3}</code>, <code>{"cmd":"pause","id":3,"days":2}</code>.</li>
<li><b>Dashboard cards:</b> Reminders Pro: next, today, upcoming, acknowledge, quick (work through Nabu Casa too).</li></ul>
<h2>Troubleshooting</h2>
<p>Nothing arrives? Press <b>Test</b> on the reminder and check <b>History</b>. An empty recipient list means the add-on cannot reach HA. Notifications and times follow Home Assistant’s time zone.</p><h2>Own buttons, TV notification and conditions</h2>
<p><b>Own buttons:</b> under <i>Options → Buttons in the mobile notification</i> add buttons that toggle/turn on/turn off an entity, start an automation, run a script, activate a scene, call a service, set a value or fire an event. Choose whether pressing also acknowledges the reminder. Android shows at most 3 buttons (yours first).</p>
<p><b>Android TV / Fire TV:</b> add the way <i>Android TV notification</i> and pick the notify service of “Notifications for Android TV”. You can set duration, position, text size, colour, icon and image.</p>
<p><b>Conditions:</b> under <i>Options → Conditions</i> only send if (or skip if) entities have a given value – e.g. temperature below 5, a person at home or a matching attribute. A skipped reminder is shown in History.</p>
<p><b>Own sensor:</b> tick <i>Create its own sensor</i> under Options to get a sensor (sensor.reminders_pro_name) with the next occurrence – handy to show on your phone.</p>
<h2>New in 1.3</h2>
<p><b>Advance notice:</b> under <i>Options → Advance notice</i> add e.g. “7 days before” and “1 day before”. You get an extra notification before each occurrence (without buttons). Enter a <i>Birth year</i> to use <code>{age}</code> in texts, e.g. “{title} turns {age}”.</p>
<p><b>After last done:</b> choose <i>After last done</i> under When. The next occurrence is counted from the day you press Done (or <i>Done now</i> on the card) – great for filter changes and the like.</p>
<p><b>From an entity:</b> choose <i>From an entity</i> under When. The reminder fires when the conditions are met (optionally for at least N minutes) and fires again only after they have been unmet in between, with an optional cooldown.</p>
<p><b>Category sensor:</b> tick 📅 on a category under Settings to get <code>sensor.reminders_pro_kategori_name</code> with the next reminder, days left and date.</p>

    el("select", {onchange: e => { mode.v = e.target.value; }}, el("option", {value: "merge"}, t("imp_merge")), el("option", {value: "replace"}, t("imp_replace"))),
