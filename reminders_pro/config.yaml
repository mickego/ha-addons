name: "Påminnelser Pro"
version: "1.3.1"
url: "https://github.com/mickego/ha-addons"
slug: reminders_pro
description: "Reminders with fully flexible repeats, all notification types, snooze/acknowledge buttons, calendar and dashboard cards (SV/EN/DE/FR/NB/FI)"
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: application
boot: auto
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:bell-ring
panel_title: "Påminnelser"
map:
  - type: homeassistant_config
    read_only: false
options:
  language: "sv"
  tts_entity: ""
  tts_language: ""
  default_snooze_min: 10
  install_integration: true
  install_card: true
schema:
  language: "list(sv|en|de|fr|nb|fi)?"
  tts_entity: "str?"
  tts_language: "str?"
  default_snooze_min: "int(1,1440)"
  install_integration: "bool"
  install_card: "bool"
