name: "IPTV EPG Påminnelser"
version: "2.2.0"
url: "https://github.com/mickego/ha-addons"
slug: iptv_epg_reminder
description: "IPTV EPG search, grid and reminders with notifications, TTS/sound, actions and channel tuning (SV/EN)"
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: application
boot: auto
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:television-guide
panel_title: "EPG"
options:
  epg_url: ""
  xtream_url: ""
  playlist_url: ""
  refresh_hours: 6
  epg_days: 7
  default_lead_minutes: 10
  tts_entity: ""
  language: "sv"
  tts_language: ""
  user_agent: "Mozilla/5.0"
schema:
  epg_url: "password?"
  xtream_url: "password?"
  playlist_url: "password?"
  refresh_hours: "int(1,48)"
  epg_days: "int(1,14)"
  default_lead_minutes: "int(0,240)"
  tts_entity: "str?"
  language: "list(sv|en|de|fr|nb|fi)?"
  tts_language: "str?"
  user_agent: "str?"
