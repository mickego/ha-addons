<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EPG</title>
<link rel="icon" href="data:,">
<style>
:root{
  --bg:#0d1118;--panel:#151b25;--panel2:#1b2331;--line:#252e3d;--text:#e6ebf2;--mute:#8b97a9;
  --accent:#4cc9f0;--accent2:#7b8cff;--amber:#ffb454;--ok:#3ddc97;--bad:#ff6b6b;
  --radius:14px;--shadow:0 6px 24px rgba(0,0,0,.28);
}
@media (prefers-color-scheme:light){
  :root{--bg:#f2f4f8;--panel:#ffffff;--panel2:#eef1f6;--line:#dde2ea;--text:#18202c;--mute:#667388;
    --accent:#0a8fc2;--accent2:#4b5fe0;--amber:#c47a0a;--ok:#12935f;--bad:#d23c3c;--shadow:0 4px 18px rgba(20,30,50,.08)}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 20px;
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:.2px}
.logo{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:17px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap;flex:1}
.pill{padding:3px 10px;border-radius:99px;background:var(--panel);border:1px solid var(--line);color:var(--mute);font-size:12px;white-space:nowrap}
.pill b{color:var(--text);font-weight:600}
.pill.err{border-color:var(--bad);color:var(--bad)}
.pill.ok b{color:var(--ok)}
.tabs{display:flex;gap:4px;background:var(--panel);padding:3px;border-radius:11px;border:1px solid var(--line)}
.tabs button,.seg button{border:0;background:transparent;padding:6px 14px;border-radius:8px;color:var(--mute);font-weight:600}
.tabs button.on,.seg button.on{background:var(--panel2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.btn{border:1px solid var(--line);background:var(--panel2);padding:7px 14px;border-radius:10px;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:4px 10px;font-size:12px;border-radius:8px}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.btn.amber{border-color:color-mix(in srgb,var(--amber) 55%,var(--line));color:var(--amber)}
.btn.done{border-color:var(--ok);color:var(--ok);cursor:default}
main{max-width:1500px;margin:0 auto;padding:18px 20px 60px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:18px;align-items:start}
@media(max-width:1050px){.grid{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.panel h3{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.9px;color:var(--mute);display:flex;justify-content:space-between;align-items:center}
.stack{display:flex;flex-direction:column;gap:18px}
.seg{display:inline-flex;gap:4px;background:var(--bg);padding:3px;border-radius:11px;border:1px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search-row{margin-top:12px;display:flex;gap:10px}
input[type=text],input[type=number],select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;outline:0;min-width:0}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.search-row input{flex:1;font-size:15px}
.filters{margin-top:12px;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:4px 12px;font-size:12.5px;color:var(--mute);font-weight:600}
.chip.on{background:color-mix(in srgb,var(--accent) 16%,var(--bg));border-color:var(--accent);color:var(--accent)}
.chip.kw{display:inline-flex;gap:6px;align-items:center}
.chip.kw i{font-style:normal;opacity:.6;cursor:pointer}.chip.kw i:hover{opacity:1;color:var(--bad)}
.lbl{color:var(--mute);font-size:12px;margin-right:2px}
.hint{color:var(--mute);font-size:12px;margin-top:8px}
code{background:var(--bg);border:1px solid var(--line);padding:1px 6px;border-radius:6px;font-size:12px}
.active{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;border-radius:12px;
  background:color-mix(in srgb,var(--accent2) 10%,var(--panel));border:1px solid color-mix(in srgb,var(--accent2) 35%,var(--line))}
.active .tag{background:var(--panel2);border:1px solid var(--line);padding:2px 10px;border-radius:99px;font-size:12.5px}
.active .tag b{color:var(--accent)}
.active .sp{flex:1}
.day{margin:18px 4px 8px;font-weight:700;color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.9px}
.card{display:flex;gap:14px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px 14px;margin-bottom:8px;transition:border-color .15s,transform .15s}
.card:hover{border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.ico{width:46px;height:46px;border-radius:10px;background:var(--panel2);display:grid;place-items:center;flex:none;overflow:hidden;font-size:20px;border:1px solid var(--line)}
.ico img{width:100%;height:100%;object-fit:contain}
.poster{width:56px;height:80px;border-radius:8px}
.body{flex:1;min-width:0}
.title{font-weight:700;font-size:15px;overflow-wrap:anywhere}
.meta{color:var(--mute);font-size:12.5px;margin-top:2px}
.meta .t{color:var(--text);font-weight:600}
.desc{color:var(--mute);font-size:12.5px;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bar{height:4px;background:var(--panel2);border-radius:4px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.live{color:var(--ok);font-weight:700;font-size:11px;letter-spacing:.8px;margin-right:6px}
.actions{display:flex;flex-direction:column;gap:6px;flex:none}
.empty{padding:40px 10px;text-align:center;color:var(--mute)}
.more{display:block;margin:14px auto}
.sched{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.sched:first-of-type{border-top:0}
.when{flex:none;width:74px;text-align:center}
.when .big{font-weight:800;font-size:16px;color:var(--amber)}
.when .rel{font-size:11px;color:var(--mute)}
.when .d{font-size:11px;color:var(--mute)}
.mini{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.mini span{font-size:11px;padding:1px 8px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);color:var(--mute)}
.mini span.type{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.scroll{max-height:540px;overflow:auto;margin:0 -6px;padding:0 6px}
.rule{padding:10px 0;border-top:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.rule:first-of-type{border-top:0}
.sw{position:relative;width:36px;height:20px;flex:none;margin-top:2px}
.sw input{display:none}.sw span{position:absolute;inset:0;background:var(--panel2);border:1px solid var(--line);border-radius:20px;transition:.2s}
.sw span:before{content:"";position:absolute;width:14px;height:14px;left:2px;top:2px;border-radius:50%;background:var(--mute);transition:.2s}
.sw input:checked+span{background:color-mix(in srgb,var(--ok) 30%,var(--panel2));border-color:var(--ok)}
.sw input:checked+span:before{transform:translateX(16px);background:var(--ok)}
.badge{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:6px;background:var(--panel2);color:var(--accent2);margin-right:6px;text-transform:uppercase;letter-spacing:.5px}
dialog{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:18px;padding:0;width:min(560px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(5,8,14,.65);backdrop-filter:blur(3px)}
.m-head{padding:18px 22px 8px}.m-head h2{margin:0;font-size:18px}.m-head p{margin:4px 0 0;color:var(--mute)}
.m-body{padding:8px 22px;display:flex;flex-direction:column;gap:14px;max-height:62vh;overflow:auto}
.m-foot{padding:14px 22px 20px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.field label{display:block;font-size:12px;color:var(--mute);margin-bottom:5px;font-weight:600}
.field input[type=text],.field input[type=number],.field select{width:100%}
.devs{display:flex;flex-wrap:wrap;gap:8px}
.dev{display:inline-flex;gap:7px;align-items:center;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);cursor:pointer;user-select:none}
.dev input{accent-color:var(--accent)}
.dev:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--bg))}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:10px 18px;border-radius:12px;box-shadow:var(--shadow);z-index:99;opacity:0;pointer-events:none;transition:.25s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}
.toast.bad{border-color:var(--bad)}.toast.good{border-color:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:7px 8px;border-top:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.7px;border-top:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}@media(max-width:900px){.two{grid-template-columns:1fr}}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s .8s linear infinite;vertical-align:-2px}
@keyframes s{to{transform:rotate(360deg)}}
.hidden{display:none!important}
.pickres{position:absolute;left:0;right:0;top:100%;z-index:10;background:var(--panel2);border:1px solid var(--line);border-radius:10px;margin-top:4px;box-shadow:var(--shadow);overflow:hidden}
.pickres:empty{display:none}.pick{padding:8px 12px;cursor:pointer}.pick:hover{background:var(--bg)}
.gtools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.gtools input[type=text]{width:190px}
.gridwrap{overflow:auto;max-height:calc(100vh - 250px);min-height:320px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);box-shadow:var(--shadow)}
.g{position:relative;min-width:max-content}
.ghead{position:sticky;top:0;z-index:6;display:flex;background:var(--panel2);border-bottom:1px solid var(--line);height:38px}
.gcorner{position:sticky;left:0;z-index:7;flex:none;width:168px;background:var(--panel2);border-right:1px solid var(--line);padding:10px 12px;font-size:11px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.8px}
.gtl{position:relative;flex:none}
.gtick{position:absolute;top:0;bottom:0;padding:9px 6px;border-left:1px solid var(--line);font-size:12px;font-weight:700;color:var(--mute);white-space:nowrap}
.gtick small{display:block;font-weight:600;font-size:10px;opacity:.8;margin-top:-2px}
.grow{display:flex;height:60px;border-top:1px solid var(--line)}
.gch{position:sticky;left:0;z-index:4;flex:none;width:168px;display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--panel);border-right:1px solid var(--line);cursor:pointer}
.gch:hover{background:var(--panel2)}
.gch .ico{width:34px;height:34px;font-size:15px;border-radius:8px}
.gname{font-weight:700;font-size:12.5px;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.gnum{display:inline-block;margin-top:2px;font-size:10.5px;font-weight:800;color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--bg));padding:0 6px;border-radius:5px}
.gline{position:relative;flex:none}
.gp{position:absolute;top:5px;bottom:5px;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:5px 8px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;justify-content:center;min-width:6px}
.gp:hover{border-color:var(--accent);z-index:2;background:color-mix(in srgb,var(--accent) 10%,var(--panel2))}
.gp b{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gp span{font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gp.past{opacity:.5}.gp.now{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--panel2))}
.gp.rem{box-shadow:inset 3px 0 0 var(--amber)}.gp.rem b:after{content:" 🔔"}
.gp.hit{outline:2px solid var(--accent2);outline-offset:-2px;background:color-mix(in srgb,var(--accent2) 22%,var(--panel2))}
.gnow{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);z-index:5;pointer-events:none;box-shadow:0 0 8px var(--bad)}
.gnow:before{content:"";position:absolute;top:36px;left:-4px;width:10px;height:10px;border-radius:50%;background:var(--bad)}
.lang{display:inline-flex}
.lang button{padding:5px 11px}
textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;outline:0;min-width:0;width:100%;font:inherit;color:inherit;resize:vertical}
textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
input[type=time]{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;outline:0}
dialog.wide{width:min(720px,96vw)}
.sec{border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:12px;background:color-mix(in srgb,var(--bg) 40%,var(--panel))}
.sec-h{font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--accent2);display:flex;justify-content:space-between;align-items:center}
.varbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px;font-size:12px}
.varbar select,.varbar input{padding:4px 8px;font-size:12px;border-radius:8px}
.varbar .entq{width:170px}.varbar .attrq{width:110px}
.acard{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel);display:flex;flex-direction:column;gap:10px}
.ahead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ahead .sp{flex:1}
.ahead select{padding:4px 8px;font-size:12px}
.addrow{display:flex;gap:8px;flex-wrap:wrap}
.hsec{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.hsec>summary{cursor:pointer;padding:13px 16px;font-weight:700;font-size:15px;list-style:none;display:flex;gap:10px;align-items:center}
.hsec>summary::-webkit-details-marker{display:none}
.hsec>summary:before{content:"▸";color:var(--accent);transition:.15s}
.hsec[open]>summary:before{transform:rotate(90deg)}
.hbody{padding:0 18px 16px;line-height:1.6}
.hbody h4{margin:16px 0 4px;font-size:13px;color:var(--accent2);text-transform:uppercase;letter-spacing:.7px}
.hbody p{margin:6px 0}.hbody ul,.hbody ol{margin:6px 0;padding-left:22px}
.hbody pre{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow:auto;font-size:12.5px;line-height:1.5;margin:8px 0}
.hbody table{margin:8px 0}.hbody td:first-child{white-space:nowrap}
.hbody .tip{border-left:3px solid var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--panel));padding:8px 12px;border-radius:0 10px 10px 0;margin:10px 0}
.hbody .warn{border-left:3px solid var(--amber);background:color-mix(in srgb,var(--amber) 8%,var(--panel));padding:8px 12px;border-radius:0 10px 10px 0;margin:10px 0}
.helpwrap{max-width:900px;margin:0 auto}
.star{background:none;border:0;font-size:15px;padding:0 2px;opacity:.35;color:var(--amber)}
.star.on{opacity:1}.star:hover{opacity:1}
.gch .star{position:absolute;right:4px;top:3px;font-size:13px}
.gch{position:sticky}
.sched.snz{opacity:.85}
.chk{display:flex;gap:8px;align-items:center}
.sub{color:var(--mute);font-size:12px}
.rowitem{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.field .varbar input[type=text],.field .varbar select{width:auto}
.field .varbar .entq{width:170px}.field .varbar .attrq{width:110px}
.field .varbar .varsel{max-width:210px}
</style></head>
<body>
<header>
  <div class="brand"><div class="logo">📺</div><span data-t="app_name"></span></div>
  <div class="chips" id="status"></div>
  <button class="btn" id="btnRefresh" data-title="refresh_tip">⟳ <span data-t="refresh"></span></button>
  <div class="tabs">
    <button data-view="main" class="on" data-t="tab_main"></button>
    <button data-view="grid" data-t="tab_grid"></button>
    <button data-view="settings" data-t="tab_settings"></button>
    <button data-view="help" data-t="tab_help"></button>
  </div>
  <div class="seg lang" id="langSeg"><button data-l="sv">SV</button><button data-l="en">EN</button><button data-l="de">DE</button><button data-l="fr">FR</button><button data-l="nb">NO</button><button data-l="fi">FI</button></div>
</header>

<main id="view-main">
  <div class="grid">
    <section class="stack">
      <div class="panel">
        <div class="row" style="justify-content:space-between">
          <div class="seg" id="kindSeg">
            <button data-k="live" class="on">📡 <span data-t="k_live"></span></button>
            <button data-k="series">📚 <span data-t="k_series"></span></button>
            <button data-k="movie">🎬 <span data-t="k_movie"></span></button>
          </div>
          <div class="seg" id="subSeg">
            <button data-s="prog" class="on" data-t="s_prog"></button>
            <button data-s="chan" data-t="s_chan"></button>
          </div>
        </div>
        <div class="search-row">
          <input type="text" id="q" data-ph="q_ph" autocomplete="off">
          <button class="btn primary" id="btnSearch" data-t="search"></button>
        </div>
        <div class="row filters" id="filters">
          <span id="whenBox" class="row" style="gap:6px"><span class="lbl" data-t="when"></span>
            <button class="chip" data-w="now" data-t="w_now"></button><button class="chip on" data-w="today" data-t="w_today"></button>
            <button class="chip" data-w="tomorrow" data-t="w_tomorrow"></button><button class="chip" data-w="week" data-t="w_week"></button>
            <button class="chip" data-w="all" data-t="w_all"></button></span>
          <select id="cat"></select>
          <input type="text" id="chan" data-ph="chan_ph" style="width:200px">
          <label class="chip" id="descrBox" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="descr"> <span data-t="in_descr"></span></label>
          <button class="chip" id="favChip">⭐ <span data-t="favs"></span></button>
        </div>
        <div class="row" style="margin-top:12px;gap:6px">
          <span class="lbl" data-t="saved_kw"></span><span id="saved" class="row" style="gap:6px"></span>
          <button class="chip" id="btnSave">＋ <span data-t="save_search"></span></button>
        </div>
        <div class="hint" id="searchHint"></div>
      </div>

      <div class="active" id="active"></div>
      <div id="results"></div>
    </section>

    <aside class="stack">
      <div class="panel">
        <h3><span>🔔 <span data-t="scheduled"></span></span> <span class="row" style="gap:8px"><button class="btn small" id="btnTime">＋ <span data-t="time_rem"></span></button><span class="pill" id="schedCount">0</span></span></h3>
        <div class="scroll" id="sched"></div>
      </div>
      <div class="panel">
        <h3><span>🧭 <span data-t="rules_h"></span></span> <span class="pill" id="ruleCount">0</span></h3>
        <div id="rules"></div>
      </div>
    </aside>
  </div>
</main>

<main id="view-grid" class="hidden">
  <div class="gtools">
    <button class="btn small" id="gPrev">◀</button><button class="btn small" id="gNow" data-t="now"></button><button class="btn small" id="gNext">▶</button>
    <span id="gDays" class="row" style="gap:5px"></span>
    <select id="gZoom"><option value="2" data-t="h2"></option><option value="3" data-t="h3" selected></option><option value="6" data-t="h6"></option><option value="12" data-t="h12"></option></select>
    <select id="gCat"></select>
    <input type="text" id="gQ" data-ph="g_chan_ph">
    <input type="text" id="gHl" data-ph="g_hl_ph">
    <button class="chip" id="gFav">⭐ <span data-t="favs"></span></button>
    <button class="btn small" id="gTimeBtn">⏰ <span data-t="time_rem"></span></button>

function dayLabel(ts){
  const now=Math.floor(Date.now()/1000);
  if(dkey(ts)===dkey(now))return t("today");
  if(dkey(ts)===dkey(now+86400))return t("tomorrow");

  return fmt(ts,{weekday:"long",day:"numeric",month:"long"});
}
function rel(ts){
  const d=ts-Math.floor(Date.now()/1000);
  if(d<=60&&d>=-60)return t("rel_now");
  const a=Math.abs(d),m=Math.round(a/60),h=Math.floor(m/60),dd=Math.floor(h/24);
  const s=dd>=1?`${dd} ${t("d_short")} ${h%24} ${t("h_short")}`:h>=1?`${h} ${t("h_short")} ${m%60} ${t("min_short")}`:`${m} ${t("min_short")}`;
  return d>0?t("rel_in")+s+(LANG==="fi"?" kuluttua":""):s+t("rel_ago");
}

    if(type==="play")return {type,when,targets:pl,fmt:q(".a-fmt").value,content_type:q(".a-ct").value,volume:q(".a-vol").value};

function bindEditor(){
  const body=$("#mBody");
  bindEntitySearch(document.body);
  body.addEventListener("focusin",e=>{if(e.target.matches(".tpl-in"))LASTF=e.target});
  body.addEventListener("click",e=>{
    const lead=e.target.closest("[data-lead]");if(lead){$("#fLead").value=lead.dataset.lead;return}
    const add=e.target.closest("[data-aadd]");
    if(add){readForm();const type=add.dataset.aadd;
      const a={type,when:"notify"};
      if(type==="tts"){a.text=({sv:"{title} börjar om {minutes} minuter på {channel}",de:"{title} beginnt in {minutes} Minuten auf {channel}",fr:"{title} commence dans {minutes} minutes sur {channel}",nb:"{title} starter om {minutes} minutter på {channel}",fi:"{title} alkaa {minutes} minuutin kuluttua kanavalla {channel}"})[LANG]||"{title} starts in {minutes} minutes on {channel}";a.targets=[]}
      if(type==="sound"){a.source="file";a.value="";a.targets=[]}
      if(type==="play"){a.when="start";a.targets=[...(DEF.play_entities||[])];a.fmt=DEF.play_fmt||"hls";a.content_type=DEF.play_ctype||"auto"}
      if(type==="service"){a.service="";a.data="{}"}
      if(type==="set_entity"){a.entity_id="";a.value="on"}
      R.actions.push(a);renderEditor();return}
    const del=e.target.closest("[data-adel]");
    if(del){readForm();R.actions.splice(+del.closest(".acard").dataset.i,1);renderEditor();return}
    const tst=e.target.closest("[data-atest]");
    if(tst){const a=readActions()[+tst.closest(".acard").dataset.i];
      api("test_action",{body:{action:a}}).then(r=>res(r,r.detail?`${t("t_ok")}: ${r.detail}`:t("t_ok"))).catch(fail);return}
  });
  body.addEventListener("change",e=>{
    if(e.target.id==="fType"){readForm();
      const l=devList(R.ntype).map(x=>x.id);let sel=R.targets.filter(x=>l.includes(x));if(!sel.length)sel=(DEF.targets||[]).filter(x=>l.includes(x));
      R.targets=sel;renderDevs($("#fDevs"),R.ntype,sel);$("#pushOpts").classList.toggle("hidden",R.ntype!=="push")}
    if(e.target.id==="fTune")$("#tuneBox").classList.toggle("hidden",!e.target.checked);
    if(e.target.id==="fRep"){$("#repOnce").classList.toggle("hidden",e.target.value!=="once");$("#repDays").classList.toggle("hidden",e.target.value!=="custom")}
    if(e.target.matches(".a-src")){const c=e.target.closest(".acard");c.querySelector(".a-val").placeholder=e.target.value==="url"?t("a_url_ph"):t("a_file_ph")}
    if(e.target.matches(".a-ex")&&e.target.value!==""){const c=e.target.closest(".acard"),x=SVC_EX[+e.target.value];c.querySelector(".a-svc").value=x[0];c.querySelector(".a-data").value=x[1];e.target.value=""}
  });
  let tm;
  body.addEventListener("input",e=>{
    if(e.target.id!=="fChSearch")return;
    clearTimeout(tm);tm=setTimeout(async()=>{
      const q=e.target.value.trim(),box=$("#chRes");if(!q){box.innerHTML="";return}
      const r=await api("search?"+new URLSearchParams({kind:"live_chan",q,limit:8}));
      box.innerHTML=r.items.map(i=>`<div class="pick" data-id="${esc(i.id)}" data-name="${esc(i.name)}">${esc(i.name)}${CHMAP[i.id]?" · "+t("chan_word")+" "+esc(CHMAP[i.id]):""}</div>`).join("");
      $$("#chRes .pick").forEach(p=>p.onclick=()=>{R.channel_id=p.dataset.id;M.chName=p.dataset.name;$("#fChSearch").value=p.dataset.name;box.innerHTML="";
        if(CHMAP[p.dataset.id])$("#fNum").value=CHMAP[p.dataset.id]});
    },250);
  });
}

async function loadSchedule(){
  const l=await api("schedule");$("#schedCount").textContent=l.length;
  if(!l.length){$("#sched").innerHTML=`<div class="empty">${t("no_sched")}</div>`;return}
  let h="",last="";
  l.forEach(s=>{

const G={from:null,day:0,hours:3,q:"",hl:"",cat:"",fav:false,limit:80,data:null,inited:false};

async function loadGrid(keep){
  const wrap=$("#gridwrap"),sx=keep?wrap.scrollLeft:0,sy=keep?wrap.scrollTop:0;
  if(!keep)wrap.innerHTML=`<div class="empty"><span class="spin"></span></div>`;
  const p=new URLSearchParams({hours:G.hours,q:G.q,hl:G.hl,cat:G.cat,limit:G.limit,fav:G.fav?"1":"0"});
  if(G.from)p.set("from",G.from);else{p.set("day",G.day);p.set("hour",18)}
  let d;try{d=await api("grid?"+p)}catch(e){wrap.innerHTML=`<div class="empty">${t("err")}: ${esc(errText(e.message))}</div>`;return}
  G.from=d.from;G.data=d;
  const ppm=PPM[d.hours]||6,W=d.hours*60*ppm;
  let ticks="";
  for(let m=0;m<=d.hours*60;m+=30){const tt=d.from+m*60;const mid=hm(tt)==="00:00";
    ticks+=`<div class="gtick" style="left:${m*ppm}px">${hm(tt)}${(m===0||mid)?`<small>${esc(shortDay(tt))}</small>`:""}</div>`}
  let h=`<div class="g"><div class="ghead"><div class="gcorner">${t("f_chan")}</div><div class="gtl" style="width:${W}px">${ticks}</div></div>`;
  if(!d.channels.length)h+=`<div class="empty" style="position:sticky;left:0">${t("no_hits")}</div>`;
  d.channels.forEach((ch,ci)=>{
    let blocks="";
    ch.programs.forEach((pg,pi)=>{
      const l=(Math.max(pg.start,d.from)-d.from)/60*ppm,r=(Math.min(pg.stop,d.to)-d.from)/60*ppm,w=Math.max(r-l-2,6);
      const cls=["gp",pg.start<=d.now&&pg.stop>d.now?"now":"",pg.stop<=d.now?"past":"",pg.has_reminder?"rem":"",pg.hit?"hit":""].join(" ");
      blocks+=`<div class="${cls}" style="left:${l}px;width:${w}px" data-c="${ci}" data-p="${pi}" title="${esc(pg.title)} (${hm(pg.start)}–${hm(pg.stop)})"><b>${esc(pg.title||t("no_title"))}</b><span>${hm(pg.start)}–${hm(pg.stop)}</span></div>`;
    });
    h+=`<div class="grow"><div class="gch" data-c="${ci}"><button class="star ${ch.fav?"on":""}" data-star="${ci}" title="${esc(t("fav_on"))}">⭐</button>${icoHtml(ch.icon,"📺")}<div><div class="gname">${esc(ch.name)}</div>${ch.number?`<span class="gnum">${esc(ch.number)}</span>`:""}</div></div><div class="gline" style="width:${W}px">${blocks}</div></div>`;
  });
  if(d.now>=d.from&&d.now<=d.to)h+=`<div class="gnow" style="left:${168+(d.now-d.from)/60*ppm}px"></div>`;
  h+=`</div>`;
  if(d.total>d.channels.length)h+=`<div style="position:sticky;left:0;padding:12px"><button class="btn" id="gMore">${t("show_more")} (${d.total-d.channels.length} ${t("left")})</button></div>`;
  wrap.innerHTML=h;wrap.scrollLeft=sx;wrap.scrollTop=sy;
  $$("#gridwrap .gp").forEach(e=>e.onclick=()=>openProgSheet(d.channels[+e.dataset.c],d.channels[+e.dataset.c].programs[+e.dataset.p]));
  $$("#gridwrap .gch").forEach(e=>e.onclick=()=>openChanSheet(d.channels[+e.dataset.c]));
  $$("#gridwrap [data-star]").forEach(e=>e.onclick=async ev=>{ev.stopPropagation();const ch=d.channels[+e.dataset.star];
    try{await api("favorites",{body:{channel_id:ch.id,on:!ch.fav}});loadGrid(true)}catch(err){fail(err)}});
  const mo=$("#gMore");if(mo)mo.onclick=()=>{G.limit+=80;loadGrid(true)};
}

  $("#pTitle").textContent=ch.name;$("#pErr").textContent="";
  const v=$("#pVideo");$("#player").showModal();
  const src=ch.vod?`stream/vod/${ch.vod}/${encodeURIComponent(ch.id)}.${encodeURIComponent(ch.ext||"mp4")}`:"stream/"+encodeURIComponent(ch.id)+".m3u8";
  try{
    if(ch.vod){v.src=src;v.onerror=()=>{$("#pErr").textContent=t("player_err_vod")}}
    else if(v.canPlayType("application/vnd.apple.mpegurl")){v.src=src}
    else{await loadHls();if(!window.Hls||!Hls.isSupported())throw 0;
      HLS=new Hls({liveSyncDurationCount:3});HLS.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal)$("#pErr").textContent=t("player_err")});
      HLS.loadSource(src);HLS.attachMedia(v)}
    v.play().catch(()=>{});
  }catch(e){$("#pErr").textContent=t("player_err")}
}
function closePlayer(){const v=$("#pVideo");v.onerror=null;try{v.pause()}catch(e){}if(HLS){HLS.destroy();HLS=null}v.removeAttribute("src");v.load();$("#player").close()}
$("#pClose").onclick=closePlayer;$("#player").addEventListener("cancel",e=>{e.preventDefault();closePlayer()});
$("#shClose").onclick=()=>$("#sheet").close();
$("#btnTime").onclick=()=>openTimeModal({});

/* ---------- events ---------- */
$$(".tabs button").forEach(b=>b.onclick=()=>{
  const v=b.dataset.view;
  $$(".tabs button").forEach(x=>x.classList.toggle("on",x===b));
  ["main","grid","settings","help"].forEach(n=>$("#view-"+n).classList.toggle("hidden",n!==v));
  if(v==="settings"){loadSettings();loadHist();loadStatus()}
  if(v==="grid"){if(!G.inited)initGrid();else loadGrid(true)}
});
$$("#langSeg button").forEach(b=>b.onclick=()=>setLang(b.dataset.l));
$$("#kindSeg button").forEach(b=>b.onclick=async()=>{S.kind=b.dataset.k;S.cat="";await loadCats();runSearch()});
$$("#subSeg button").forEach(b=>b.onclick=async()=>{S.sub=b.dataset.s;S.cat="";await loadCats();runSearch()});
$$("#whenBox .chip").forEach(b=>b.onclick=()=>{S.when=b.dataset.w;runSearch()});
$("#favChip").onclick=()=>{S.fav=!S.fav;runSearch()};
$("#btnSearch").onclick=()=>runSearch();
$("#q").onkeydown=$("#chan").onkeydown=e=>{if(e.key==="Enter")runSearch()};
$("#cat").onchange=()=>runSearch();$("#descr").onchange=()=>runSearch();
$("#btnSave").onclick=async()=>{
  readControls();if(!S.q){toast(t("write_kw_first"),"bad");return}
  await api("saved",{body:{kind:kindKey(),pattern:S.q}});await loadSaved();toast(t("kw_saved"),"good");
};
$("#btnRefresh").onclick=async()=>{await api("refresh",{body:{}});const tm=setInterval(async()=>{await loadStatus();if(!ST.refreshing){clearInterval(tm);runSearch();loadSchedule()}},3000);loadStatus()};

(async function init(){
  const dl=document.createElement("datalist");dl.id="entdl";document.body.appendChild(dl);
  bindEditor();
  try{await loadStatus();LANG=LANGS.includes(ST.lang)?ST.lang:"sv"}catch(e){}
  applyLang();
  try{TG=await api("targets")}catch(e){}
  await Promise.all([loadSettings(),loadSaved(),loadCats(),loadChmap()]);
  renderStatus();syncControls();runSearch();loadSchedule();loadRules();
  setInterval(()=>{loadSchedule();loadStatus()},60000);
})();

</script>
</body>
</html>
